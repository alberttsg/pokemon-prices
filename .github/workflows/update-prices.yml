name: Update prices

# Descarga cada día los precios de Pokémon de TCGCSV y los publica en la rama gh-pages (GitHub Pages),
# que es de donde los lee la app Mikon.

on:
  schedule:
    # TCGCSV se actualiza hacia las 20:00 UTC. La segunda pasada es un reintento: si la primera
    # ya publicó los precios del día, no descarga nada
    - cron: '0 21 * * *'
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Lo ya publicado: el script añade el día de hoy al histórico de cada carta
      - name: Get published prices
        run: |
          if git ls-remote --exit-code --heads "$REMOTE" gh-pages > /dev/null; then
            git clone --depth 1 --branch gh-pages "$REMOTE" public
          else
            mkdir public
          fi

      - name: Download prices
        id: build
        run: node build.mjs public

      # Un único commit que sustituye al anterior: el repositorio no crece con cada día
      - name: Publish
        if: steps.build.outputs.changed == 'true'
        run: |
          cd public
          rm -rf .git
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Prices $(date -u +%F)"
          git push -q --force "$REMOTE" gh-pages
